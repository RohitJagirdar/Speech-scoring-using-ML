# Lint + unit tests on every push. The unit tests need no GPU, audio or
# trained model, so CI installs only the light libraries (no torch/Whisper).
name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy pandas scikit-learn scipy lightgbm pyspellchecker textstat pytest ruff
      - run: ruff check .
      - run: pytest -q
